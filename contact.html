<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Fathima Famna</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #00ffe1;
      --primary-dark: #00c9b7;
      --dark: #0a0a0a;
      --light: #f8f9fa;
      --gray: #e9ecef;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--light);
      background-color: var(--dark);
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .navbar.scrolled {
      padding: 1rem 5%;
      box-shadow: 0 5px 20px rgba(0, 255, 225, 0.1);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .logo:hover {
      color: var(--primary-dark);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      position: relative;
      color: var(--light);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background-color: var(--primary);
      transition: var(--transition);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .hamburger {
      display: none;
      cursor: pointer;
      color: var(--light);
    }

    /* Contact Section */
    .contact-section {
      min-height: 100vh;
      padding: 120px 5% 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .contact-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 10, 10, 0.85);
      z-index: -1;
    }

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      transform: translateX(-20px);
      opacity: 0;
      animation: fadeInLeft 0.8s 0.6s forwards;
    }

    .contact-card {
      background: rgba(10, 10, 10, 0.7);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid rgba(0, 255, 225, 0.2);
      backdrop-filter: blur(8px);
      transition: var(--transition);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .contact-card:hover {
      transform: translateY(-10px);
      border-color: var(--primary);
      box-shadow: 0 15px 40px rgba(0, 255, 225, 0.1);
    }

    .contact-icon {
      font-size: 2rem;
      color: var(--primary);
      min-width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 255, 225, 0.1);
      border-radius: 50%;
      transition: var(--transition);
    }

    .contact-card:hover .contact-icon {
      background: var(--primary);
      color: var(--dark);
      transform: rotate(15deg) scale(1.1);
    }

    .contact-details h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--light);
    }

    .contact-details p {
      font-size: 1rem;
      color: var(--gray);
      line-height: 1.6;
    }

    /* Contact Form */
    .contact-form-container {
      background: rgba(10, 10, 10, 0.7);
      border-radius: 16px;
      padding: 3rem;
      border: 1px solid rgba(0, 255, 225, 0.2);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transform: translateX(20px);
      opacity: 0;
      animation: fadeInRight 0.8s 0.6s forwards;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      color: var(--primary);
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 60px;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }

    .contact-form p {
      font-size: 1.1rem;
      color: var(--gray);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: var(--gray);
      transition: var(--transition);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--light);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 255, 225, 0.2);
    }

    .form-control:focus + label,
    .form-control:not(:placeholder-shown) + label {
      top: -0.5rem;
      left: 0.8rem;
      font-size: 0.8rem;
      background: var(--dark);
      padding: 0 0.5rem;
      color: var(--primary);
    }

    textarea.form-control {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: var(--dark);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 255, 225, 0.2);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      width: 100%;
      padding: 1rem;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .whatsapp-btn:hover {
      background: #128C7E;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
    }

    .whatsapp-btn i {
      font-size: 1.2rem;
    }

    /* Animations */
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Responsive Design */
    @media (max-width: 992px) {
      .contact-container {
        gap: 2rem;
      }
      .section-title {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }
      .nav-links {
        position: fixed;
        top: 80px;
        left: -100%;
        width: 100%;
        height: calc(100vh - 80px);
        background-color: var(--dark);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        transition: var(--transition);
      }
      .nav-links.active {
        left: 0;
      }
      .contact-container {
        grid-template-columns: 1fr;
        padding: 2rem 0;
      }
      .contact-info {
        order: 2;
      }
      .contact-form-container {
        order: 1;
      }
    }

    @media (max-width: 576px) {
      .section-title {
        font-size: 2rem;
      }
      .contact-card {
        flex-direction: column;
        text-align: center;
      }
      .contact-form-container {
        padding: 2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="logo">famna</a>
    <div class="hamburger">
      <i class="fas fa-bars"></i>
    </div>
    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./service.html">Service</a>
      <a href="./contact.html">Contact</a>
    </div>
  </nav>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="contact-background"></div>
    <div class="contact-container">
      <div class="contact-info">
        <div class="contact-card">
          <div class="contact-icon">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div class="contact-details">
            <h3>Location</h3>
            <p>Kasaragod, Kerala, India</p>
          </div>
        </div>

        <div class="contact-card">
          <div class="contact-icon">
            <i class="fas fa-phone-alt"></i>
          </div>
          <div class="contact-details">
            <h3>Phone</h3>
            <p>+91 8139066551</p>
          </div>
        </div>

        <div class="contact-card">
          <div class="contact-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <div class="contact-details">
            <h3>Email</h3>
            <p>famnaattagoli@gmail.com</p>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <h1 class="section-title">Get In Touch</h1>
        <p>Have a project in mind or want to collaborate? Feel free to reach out!</p>
        
        <form class="contact-form" method="POST">
          <div class="form-group">
            <input type="text" class="form-control" id="name" name="name" placeholder=" " required>
            <label for="name">Your Name</label>
          </div>
          
          <div class="form-group">
            <input type="email" class="form-control" id="email" name="email" placeholder=" " required>
            <label for="email">Your Email</label>
          </div>
          
          <div class="form-group">
            <input type="text" class="form-control" id="subject" name="subject" placeholder=" ">
            <label for="subject">Subject</label>
          </div>
          
          <div class="form-group">
            <textarea class="form-control" id="message" name="message" placeholder=" " required></textarea>
            <label for="message">Your Message</label>
          </div>
          
          <button type="submit" class="submit-btn">Send Message</button>
          <button type="button" class="whatsapp-btn">
            <i class="fab fa-whatsapp"></i> Send via WhatsApp
          </button>
        </form>
      </div>
    </div>
  </section>

  <script>
    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Mobile menu toggle
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');

    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      hamburger.innerHTML = navLinks.classList.contains('active') ? 
        '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
    });

    // Close mobile menu when clicking a link
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
        hamburger.innerHTML = '<i class="fas fa-bars"></i>';
      });
    });

    // Floating animation for contact cards
    const contactCards = document.querySelectorAll('.contact-card');
    contactCards.forEach((card, index) => {
      card.style.animation = `float 3s ease-in-out ${index * 0.2 + 1}s infinite`;
    });

    // Form input focus effects
    const formControls = document.querySelectorAll('.form-control');
    formControls.forEach(control => {
      control.addEventListener('focus', () => {
        control.parentElement.querySelector('label').style.color = 'var(--primary)';
      });
      control.addEventListener('blur', () => {
        if (!control.value) {
          control.parentElement.querySelector('label').style.color = 'var(--gray)';
        }
      });
    });

    // WhatsApp integration for contact form
    document.querySelector('.whatsapp-btn').addEventListener('click', function() {
      const name = document.getElementById('name').value.trim() || 'Not provided';
      const email = document.getElementById('email').value.trim() || 'Not provided';
      const subject = document.getElementById('subject').value.trim() || 'No subject';
      const message = document.getElementById('message').value.trim() || 'No message';
      
      // Use your actual WhatsApp number here (with country code, no + or spaces)
      const whatsappNumber = '919946655357'; // Replace with your number
      
      const text = `Hello Fathima Famna,%0A%0AI'd like to get in touch:%0A%0A*Name:* ${name}%0A*Email:* ${email}%0A*Subject:* ${subject}%0A%0A*Message:*%0A${message}`;

      window.open(`https://wa.me/${whatsappNumber}?text=${text}`, '_blank');
    });

    // Form submission handling
    document.querySelector('.contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Here you would normally send the form data to your server
      alert('Thank you for your message! I will get back to you soon.');
      this.reset();
    });
  </script>
</body>

</html>
