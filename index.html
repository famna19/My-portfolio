<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fathima Famna | Front-End Developer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #00c9b7;
      --primary-dark: #00a396;
      --dark: #121212;
      --light: #f8f9fa;
      --gray: #e9ecef;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--dark);
      background-color: var(--light);
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
    }

    .navbar.scrolled {
      padding: 1rem 5%;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .logo:hover {
      color: var(--primary-dark);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      position: relative;
      color: var(--dark);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background-color: var(--primary);
      transition: var(--transition);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .hamburger {
      display: none;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      padding: 0 10%;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s 0.3s forwards;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #555;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s 0.6s forwards;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s 0.9s forwards;
    }

    .btn {
      position: relative;
      overflow: hidden;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      z-index: 1;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-outline {
      background-color: transparent;
      color: var(--dark);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: white;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
      z-index: -1;
    }

    .btn:focus:not(:active::after) {
      animation: ripple 1s ease-out;
    }

    .hero-image {
      position: absolute;
      right: 10%;
      width: 40%;
      max-width: 600px;
      opacity: 0;
      transform: translateX(50px);
      animation: fadeInRight 1s 1.2s forwards;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.1));
    }

    .social-links {
      position: absolute;
      left: 5%;
      bottom: 10%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      opacity: 0;
      animation: fadeIn 1s 1.5s forwards;
    }

    .social-links a {
      color: var(--dark);
      font-size: 1.5rem;
      transition: var(--transition);
    }

    .social-links a:hover {
      color: var(--primary);
      transform: translateY(-3px);
    }

    .scroll-down {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--dark);
      text-decoration: none;
      opacity: 0;
      animation: fadeIn 1s 1.8s forwards;
    }

    .scroll-down span {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .mouse {
      width: 25px;
      height: 40px;
      border: 2px solid var(--dark);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      padding-top: 5px;
    }

    .mouse-wheel {
      width: 4px;
      height: 8px;
      background-color: var(--dark);
      border-radius: 2px;
      animation: scrollWheel 2s infinite;
    }

    /* Animations */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInRight {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes scrollWheel {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(10px);
        opacity: 0;
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0, 0);
        opacity: 1;
      }
      20% {
        transform: scale(25, 25);
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(40, 40);
      }
    }

    /* Responsive Design */
    @media (max-width: 992px) {
      .hero h1 {
        font-size: 3rem;
      }
      .hero-image {
        width: 50%;
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }
      .nav-links {
        position: fixed;
        top: 80px;
        left: -100%;
        width: 100%;
        height: calc(100vh - 80px);
        background-color: white;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        transition: var(--transition);
      }
      .nav-links.active {
        left: 0;
      }
      .hero {
        flex-direction: column;
        text-align: center;
        padding-top: 100px;
      }
      .hero-content {
        max-width: 100%;
      }
      .hero-btns {
        justify-content: center;
      }
      .hero-image {
        position: relative;
        right: auto;
        width: 80%;
        margin-top: 3rem;
      }
      .social-links {
        position: relative;
        left: auto;
        bottom: auto;
        flex-direction: row;
        justify-content: center;
        margin-top: 3rem;
      }
    }

    @media (max-width: 576px) {
      .hero h1 {
        font-size: 2.5rem;
      }
      .hero p {
        font-size: 1rem;
      }
      .hero-btns {
        flex-direction: column;
      }
    }

    .section {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(.77, 0, .18, 1), transform 0.8s cubic-bezier(.77, 0, .18, 1);
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="#" class="logo">famna</a>
    <div class="hamburger">
      <i class="fas fa-bars"></i>
    </div>
    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./service.html">Service</a>
      <a href="./contact.html">Contact</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1> I'm <span>Famna</span><br>Front-End Developer</h1>
      <p>I create beautiful, responsive websites with modern technologies and user-centered design principles.</p>
      <div class="hero-btns">
        <button class="btn btn-primary">View My Work</button>
        <button class="btn btn-outline">Contact Me</button>
      </div>
    </div>
    <div class="hero-image">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRebSv-rcVwLXLfxXeSsAf4DHBmLmbo0IKP130VctX_vAuCac8j6TnIWzzwPWldeCRGa2s&usqp=CAU" alt="Web Developer Illustration">
    </div>
    <div class="social-links">
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
      <a href="#"><i class="fab fa-dribbble"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
    </div>
   
  </section>

  <script>
    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Mobile menu toggle
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');

    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      hamburger.innerHTML = navLinks.classList.contains('active') ? 
        '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
    });

    // Close mobile menu when clicking a link
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
        hamburger.innerHTML = '<i class="fas fa-bars"></i>';
      });
    });

    // Button ripple effect
    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        let x = e.clientX - e.target.getBoundingClientRect().left;
        let y = e.clientY - e.target.getBoundingClientRect().top;
        
        let ripples = document.createElement('span');
        ripples.style.left = x + 'px';
        ripples.style.top = y + 'px';
        this.appendChild(ripples);
        
        setTimeout(() => {
          ripples.remove();
        }, 1000);
      });
    });

    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
</body>

</html>
